<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trapeze: Free PDF Editor That Runs in Your Browser</title>
    <meta name="description" content="Create, import and edit PDFs in your browser. Drafts stay on your device and PDFs export with zero uploads to a server. Free. Powered by BrowserPod." />
    <link rel="canonical" href="https://trapeze.browserpod.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trapeze" />
    <meta property="og:title" content="Trapeze: Free PDF Editor That Runs in Your Browser" />
    <meta property="og:description" content="Create, import and edit PDFs in your browser. Drafts stay on your device and PDFs export with zero uploads to a server. Free. Powered by BrowserPod." />
    <meta property="og:url" content="https://trapeze.browserpod.io/" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="siteShell" class="site-shell">
      <header id="liveHeader" class="app-header is-hidden">
        <div class="header-brand">
          <img class="header-logo" src="/image.png" alt="Trapeze" />
          <p class="eyebrow"><a href="https://browserpod.io" target="_blank" rel="noopener">Powered by BrowserPod</a></p>
        </div>
      </header>

      <main class="app-main">
        <section id="launchScreen" class="launch-screen">
          <div class="launch-card">
            <div class="brand-lockup">
              <img class="brand-logo" src="/image.png" alt="Trapeze" />
              <p class="eyebrow"><a href="https://browserpod.io" target="_blank" rel="noopener">Powered by BrowserPod</a></p>
            </div>

            <h1 class="launch-title">Free PDF editor in your browser</h1>

            <p class="lede">
              Create, import and edit PDFs. Drafts stay in this browser and finished
              PDFs export from your device, with zero uploads to a server.
            </p>

            <div class="launch-actions">
              <button id="launchButton" class="primary" type="button">Launch Studio</button>
            </div>

            <div id="launchProgress" class="launch-progress" aria-hidden="true">
              <div id="launchProgressBar" class="launch-progress-bar"></div>
            </div>
          </div>
        </section>

        <section id="portalSection" class="portal-stage is-hidden">
          <p id="portalText" class="sr-only">Portal will appear here after the pod starts.</p>
          <iframe id="portal" class="portal" title="Trapeze PDF editor"></iframe>
        </section>
      </main>

      <div class="sr-only" aria-live="polite">
        <span id="statusPill">Ready</span>
        <span id="statusDot"></span>
        <span id="statusHeadline">Status</span>
        <span id="statusText">Ready to launch.</span>
      </div>

      <div id="console" class="console-mount" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
